{% extends 'base.html' %}
{% block title %}模块化合伙人对账{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/reconciliation_v2.css') }}">
<div id="rec-app" data-csrf="{{ rec_csrf }}">
  <header class="rec-header"><div><div class="rec-kicker">库存来源 · 合作费用 · 对账与资金</div><h1>模块化合伙人对账</h1><p>货权跟随实际出库批次；客户运费收入与物流账单分别核算。</p></div><a href="/partner-reconciliation" class="rec-button secondary">旧版对账与收款记录</a></header>
  <div id="rec-message" role="status" aria-live="polite"></div>
  <nav class="rec-tabs" aria-label="对账模块">
    <button data-tab="overview" class="active">总览</button><button data-tab="cooperation">合作规则</button><button data-tab="inventory">库存来源</button><button data-tab="orders">订单与利润</button><button data-tab="statements">对账与资金</button>
  </nav>
  <section id="rec-view" aria-live="polite"><p>正在加载…</p></section>
  <dialog id="rec-dialog"><form id="rec-form"><header><h2 id="rec-form-title"></h2><button type="button" id="rec-close" aria-label="关闭">×</button></header><div id="rec-fields"></div><p id="rec-form-error" role="alert"></p><footer><button type="button" id="rec-cancel">取消</button><button type="submit">保存</button></footer></form></dialog>
  <dialog id="rec-detail"><header><h2>核对明细</h2><button type="button" id="rec-detail-close" aria-label="关闭明细">×</button></header><div id="rec-detail-content"></div></dialog>
</div>
<script src="{{ url_for('static', filename='js/reconciliation_v2.js') }}" defer></script>
{% endblock %}
