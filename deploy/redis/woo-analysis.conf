# Included last from /etc/redis/redis.conf by the production cutover.
# Celery is the only consumer; PostgreSQL remains authoritative.
bind 127.0.0.1
protected-mode yes
port 6379

# Retain both RDB snapshots and an every-second AOF.
save 3600 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no

# Broker messages must never be evicted silently.
maxmemory 256mb
maxmemory-policy noeviction

# Local observability and conservative client hygiene.
timeout 0
tcp-keepalive 300
loglevel notice
