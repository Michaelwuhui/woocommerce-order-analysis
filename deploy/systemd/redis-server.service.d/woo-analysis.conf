[Service]
# A host-local jemalloc in /usr/local/lib is selected by ldconfig, but the
# distro Redis unit intentionally disallows executable mappings there. Prefer
# the distro library from the unit's existing /lib allow-list instead of
# widening ExecPaths for all of /usr/local/lib.
Environment=LD_LIBRARY_PATH=/lib/x86_64-linux-gnu
